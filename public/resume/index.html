<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume — Mohammed Waseem Khan</title>
<meta name="description" content="Resume of Mohammed Waseem Khan — Platform Engineer, Denver, CO.">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A;--bg-1:#141414;--bg-2:#1E1E1E;--bg-3:#282828;
  --ink:#E5E5E5;--ink-2:#A3A3A3;--ink-3:#6B6B6B;
  --amber:#E5A00D;--green:#22C55E;
  --line:#1E1E1E;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,.68,.18,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
::selection{background:var(--amber);color:var(--bg)}
a{color:var(--amber);text-decoration:none;transition:color .15s}
a:hover{color:#F5B731}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}

.top{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);flex-shrink:0;gap:12px;flex-wrap:wrap}
.top-left{display:flex;align-items:center;gap:16px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-3);padding:6px 12px;border-radius:6px;transition:color .15s,background .15s}
.back:hover{color:var(--ink);background:var(--bg-2);text-decoration:none}
.back svg{width:16px;height:16px}
.name{font-weight:600;font-size:16px}
.name span{color:var(--ink-3);font-weight:400}
.top-right{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:6px;font-weight:500;font-size:14px;border:1px solid var(--bg-3);color:var(--ink);background:var(--bg-1);cursor:pointer;font-family:var(--sans);transition:background .15s,border-color .15s,transform .15s var(--ease)}
.btn:hover{text-decoration:none;background:var(--bg-2);border-color:var(--ink-3);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--amber);color:var(--bg);border-color:var(--amber)}
.btn.primary:hover{background:#F5B731;border-color:#F5B731;box-shadow:0 8px 20px -10px rgba(229,160,13,.5)}
.btn svg{width:14px;height:14px}
.info{font-family:var(--mono);font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.info i{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}

.viewer{flex:1;display:flex;align-items:stretch;justify-content:center;padding:24px;overflow:auto;background:var(--bg)}
.viewer iframe{width:100%;max-width:900px;border:1px solid var(--line);border-radius:10px;background:#fff}

/* mobile fallback */
.mobile-fallback{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;gap:20px}
.mobile-fallback p{color:var(--ink-2);max-width:40ch;font-size:15px}
.mobile-fallback .preview-img{width:100%;max-width:380px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg-1)}
.mobile-fallback .preview-img img{width:100%;display:block}

@media(max-width:700px){
  .viewer{display:none}
  .mobile-fallback{display:flex}
  .info{display:none}
}
</style>
</head>
<body>

<div class="top">
  <div class="top-left">
    <a class="back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m0 0l7 7m-7-7l7-7"/></svg>mwk.dev</a>
    <span class="name">Resume <span>— Mohammed Waseem Khan</span></span>
  </div>
  <div class="top-right">
    <span class="info"><i></i>Updated Aug 2026</span>
    <a class="btn" href="/resume.pdf" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>Open PDF</a>
    <a class="btn primary" href="/resume.pdf" download="Mohammed_Waseem_Khan_Resume.pdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>Download</a>
  </div>
</div>

<div class="viewer">
  <iframe src="/resume.pdf#toolbar=0&navpanes=0" title="Resume of Mohammed Waseem Khan"></iframe>
</div>

<div class="mobile-fallback">
  <p>PDF preview isn't available on mobile. Tap below to open or download.</p>
  <div class="top-right" style="display:flex;gap:10px">
    <a class="btn" href="/resume.pdf" target="_blank" rel="noopener">Open PDF</a>
    <a class="btn primary" href="/resume.pdf" download="Mohammed_Waseem_Khan_Resume.pdf">Download</a>
  </div>
</div>

</body>
</html>
